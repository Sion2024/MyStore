<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавяне на профил - My Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/profile-add.css}">
</head>
<body class="profile-add-page">
<div class="top-banner">
    Безплатна доставка за поръчки над 150 €
</div>

<header class="header">
    <div th:replace="~{fragments/header :: logo}"></div>
    <div class="search-bar">
        <form th:action="@{/products}" method="get" style="display: flex; width: 100%;">
            <input type="text" name="search" class="search-input" th:placeholder="#{header.search.placeholder}">
            <button type="submit" class="search-button">🔍</button>
        </form>
    </div>
    <div class="header-utils" style="margin-left: auto;">
        <a th:href="@{/change-language(lang=${#locale.language == 'bg' ? 'en' : 'bg'})}" class="language-selector" style="text-decoration: none; color: inherit;">
            <span th:if="${#locale.language == 'bg'}">🇬🇧</span>
            <span th:if="${#locale.language == 'en'}">🇧🇬</span>
            <span th:if="${#locale.language == 'bg'}" th:text="#{lang.english}">English</span>
            <span th:if="${#locale.language == 'en'}" th:text="#{lang.bulgarian}">Български</span>
        </a>
        <a class="icon-btn" th:href="@{/profile}" aria-label="Профил"
           th:classappend="${session.userId != null ? 'logged-in' : ''}"
           style="position: relative;">
            <span th:if="${session.userId != null}">✅</span>
            <span th:if="${session.userId == null}">👤</span>
        </a>
        <a class="icon-btn" th:href="@{/wishlist-view}" aria-label="Любими">❤️</a>
        <a class="icon-btn" th:href="@{/cart}" aria-label="Количка">🛒</a>
    </div>
</header>

    <nav th:replace="~{fragments/nav :: nav}"></nav>

<main class="profile-add-main">
    <section class="profile-card">
        <h1 class="profile-card-title">Регистрация и вход</h1>
        <!-- Error Messages -->
        <div th:if="${error}" style="padding: 1rem; background: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 1rem;">
            <span th:text="${error}"></span>
        </div>

        <form class="profile-form" th:action="@{/profile/add}" method="post" th:object="${userRegistrationDto}">
            <div class="form-row">
                <label for="firstName">Име</label>
                <input id="firstName" name="firstName" type="text" placeholder="Име" th:field="*{firstName}" required>
                <div th:if="${#fields.hasErrors('firstName')}" style="color: #dc3545; margin-top: 0.5rem; font-size: 0.875rem;">
                    <span th:errors="*{firstName}">First name error</span>
                </div>
            </div>
            <div class="form-row">
                <label for="password">Парола</label>
                <input id="password" name="password" type="password" placeholder="Създайте парола" th:field="*{password}" required>
                <div th:if="${#fields.hasErrors('password')}" style="color: #dc3545; margin-top: 0.5rem; font-size: 0.875rem;">
                    <span th:errors="*{password}">Password error</span>
                </div>
            </div>
            <div class="form-row">
                <label for="email">E-mail</label>
                <input id="email" name="email" type="email" placeholder="example@email.com" th:field="*{email}" required>
                <div th:if="${#fields.hasErrors('email')}" style="color: #dc3545; margin-top: 0.5rem; font-size: 0.875rem;">
                    <span th:errors="*{email}">Email error</span>
                </div>
            </div>

            <div class="form-row">
                <button type="submit" class="submit-btn">Регистрация</button>
            </div>
        </form>
        <div class="form-footer">
            <span>Вече имате профил?</span>
            <a th:href="@{/profile}" class="link-accent">Влезте тук</a>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление на продукти - My Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="top-banner">
        Безплатна доставка за поръчки над 150 лв. / 76.69 €
    </div>

    <header class="header">
        <div class="logo-section">
            <a th:href="@{/}" style="text-decoration: none; color: inherit;">
                <span class="logo-text">My Store</span>
                <div class="logo-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </a>
        </div>
        <div class="header-utils" style="margin-left: auto;">
            <a class="icon-btn" th:href="@{/profile}" aria-label="Профил"
               th:classappend="${session.userId != null ? 'logged-in' : ''}"
               style="position: relative;">
                <span th:if="${session.userId != null}">✅</span>
                <span th:if="${session.userId == null}">👤</span>
            </a>
            <a class="icon-btn" th:href="@{/wishlist-view}" aria-label="Любими">❤️</a>
            <a class="icon-btn" th:href="@{/cart}" aria-label="Количка">🛒</a>
        </div>
    </header>

    <nav class="nav-menu">
        <ul>
            <li><a th:href="@{/}">Начало</a></li>
            <li><a th:href="@{/products}">Продукти</a></li>
            <li><a th:href="@{/admin/users}">Потребители</a></li>
        </ul>
    </nav>

    <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; color: #333; margin: 0;">Управление на продукти</h1>
            <a th:href="@{/products/create}" 
               style="padding: 0.75rem 1.5rem; background: #28a745; color: white; text-decoration: none; border-radius: 4px; font-weight: bold;">
                + Добави продукт
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" style="padding: 1rem; background: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 1rem;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" style="padding: 1rem; background: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 1rem;">
            <span th:text="${error}"></span>
        </div>

        <!-- Products Table -->
        <div style="background: white; border-radius: 8px; border: 1px solid #ddd; overflow: hidden;">
            <table style="width: 100%; border-collapse: collapse;">
                <thead style="background: #f8f9fa;">
                    <tr>
                        <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #ddd;">ID на поръчка</th>
                        <th style="padding: 1rem; text-align: left; border-bottom: 2px solid #ddd;">Потребители (поръчали)</th>
                        <th style="padding: 1rem; text-align: center; border-bottom: 2px solid #ddd;">Действия</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}" style="border-bottom: 1px solid #eee;">
                        <td style="padding: 1rem;">
                            <div th:each="orderId : ${productOrderIdsMap.get(product.id)}" 
                                 style="margin-bottom: 0.5rem;">
                                <a th:href="@{/orders/{id}(id=${orderId})}" 
                                   style="color: #007bff; text-decoration: none; font-weight: bold; font-family: monospace;"
                                   th:text="${#strings.substring(orderId.toString(), 0, 8)}">ID</a>
                            </div>
                        </td>
                        <td style="padding: 1rem;">
                            <div th:each="user : ${productUsersMap.get(product.id)}" 
                                 style="margin-bottom: 0.5rem; padding: 0.5rem; background: #f8f9fa; border-radius: 4px;">
                                <div style="font-weight: bold; color: #333; margin-bottom: 0.25rem;">
                                    <span th:text="${user.name}">Име</span>
                                </div>
                                <div style="font-size: 0.875rem; color: #666;">
                                    <span th:text="${user.email}">email</span>
                                </div>
                                <div th:if="${user.role != null}" 
                                     style="font-size: 0.75rem; color: #999; margin-top: 0.25rem;">
                                    <span>Роля: </span><span th:text="${user.role}">USER</span>
                                </div>
                            </div>
                        </td>
                        <td style="padding: 1rem; text-align: center;">
                            <form th:action="@{/admin/orders/{id}/delete(id=${product.id})}" method="post" style="display: inline;">
                                <button type="submit" 
                                        onclick="return confirm('Сигурни ли сте, че искате да изтриете този продукт?');"
                                        style="padding: 0.5rem 1rem; background: #dc3545; color: white; border: none; border-radius: 4px; font-size: 0.875rem; cursor: pointer;">
                                    Изтрий
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${products == null or #lists.isEmpty(products)}">
                        <td colspan="3" style="padding: 2rem; text-align: center; color: #666;">
                            Няма налични продукти.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer" style="margin-top: 4rem; padding: 2rem; background: #f8f9fa; text-align: center;">
        <p>&copy; 2025 My Store. All rights reserved.</p>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моите Поръчки - My Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="top-banner">
        Безплатна доставка за поръчки над 150 €
    </div>

    <header class="header">
        <div th:replace="~{fragments/header :: logo}"></div>
        <div class="search-bar">
            <form th:action="@{/products}" method="get" style="display: flex; width: 100%;">
                <input type="text" name="search" class="search-input" th:placeholder="#{header.search.placeholder}">
                <button type="submit" class="search-button">🔍</button>
            </form>
        </div>
        <div class="header-utils" style="margin-left: auto;">
            <a th:href="@{/change-language(lang=${#locale.language == 'bg' ? 'en' : 'bg'})}" class="language-selector" style="text-decoration: none; color: inherit;">
                <span th:if="${#locale.language == 'bg'}">🇬🇧</span>
                <span th:if="${#locale.language == 'en'}">🇧🇬</span>
                <span th:if="${#locale.language == 'bg'}" th:text="#{lang.english}">English</span>
                <span th:if="${#locale.language == 'en'}" th:text="#{lang.bulgarian}">Български</span>
            </a>
            <a class="icon-btn" th:href="@{/profile}" aria-label="Профил"
               th:classappend="${session.userId != null ? 'logged-in' : ''}"
               style="position: relative;">
                <span th:if="${session.userId != null}">✅</span>
                <span th:if="${session.userId == null}">👤</span>
            </a>
            <a class="icon-btn" th:href="@{/wishlist-view}" aria-label="Любими">❤️</a>
            <a class="icon-btn" th:href="@{/cart}" aria-label="Количка">🛒</a>
        </div>
    </header>

        <nav th:replace="~{fragments/nav :: nav}"></nav>

    <main style="max-width: 1200px; margin: 2rem auto; padding: 0 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2rem; color: #333;">Моите Поръчки</h1>
            <a th:href="@{/}" style="padding: 0.5rem 1rem; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">
                Продължи пазаруване
            </a>
        </div>

        <!-- Success/Error Messages -->
        <div th:if="${success}" style="padding: 1rem; background: #d4edda; color: #155724; border-radius: 4px; margin-bottom: 1rem;">
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" style="padding: 1rem; background: #f8d7da; color: #721c24; border-radius: 4px; margin-bottom: 1rem;">
            <span th:text="${error}"></span>
        </div>

        <!-- Orders List -->
        <div th:if="${orders != null and !#lists.isEmpty(orders)}">
            <div class="orders-list" style="display: flex; flex-direction: column; gap: 1.5rem;">
                <div class="order-card" th:each="order : ${orders}" 
                     style="border: 1px solid #ddd; border-radius: 8px; padding: 1.5rem; background: white;">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                        <div>
                            <h3 style="margin: 0 0 0.5rem 0;">Поръчка #<span th:text="${order.id}">ID</span></h3>
                            <p style="margin: 0; color: #666; font-size: 0.875rem;">
                                Дата: <span th:text="${order.date != null ? #temporals.format(order.date.atZoneSameInstant(T(java.time.ZoneId).of('Europe/Sofia')).toLocalDateTime(), 'dd.MM.yyyy HH:mm') : 'N/A'}">N/A</span>
                            </p>
                        </div>
                        <div style="text-align: right;">
                            <span th:switch="${order.status}" 
                                  style="padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.875rem; font-weight: bold;">
                                <span th:case="APPROVED" style="background: #ffc107; color: #000;">Одобрена</span>
                                <span th:case="IN_TRANSIT" style="background: #17a2b8; color: #fff;">В доставка</span>
                                <span th:case="DELIVERED" style="background: #28a745; color: #fff;">Доставена</span>
                                <span th:case="*" th:text="${order.status}">Статус</span>
                            </span>
                        </div>
                    </div>
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 1rem;">
                        <div>
                            <p style="margin: 0; font-size: 1.25rem; font-weight: bold;">
                                Обща сума: <span style="color: #28a745;" th:text="${orderTotals != null and orderTotals.containsKey(order.id) ? orderTotals.get(order.id) + ' €' : '0.00 €'}">0.00 €</span>
                            </p>
                        </div>
                        <div>
                            <a th:href="@{/orders/{id}(id=${order.id})}" 
                               style="padding: 0.5rem 1.5rem; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">
                                Виж детайли
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${orders == null or #lists.isEmpty(orders)}" 
             style="text-align: center; padding: 4rem 2rem; background: #f8f9fa; border-radius: 8px;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">📦</div>
            <h2>Нямате поръчки</h2>
            <p>Все още не сте направили поръчки.</p>
            <a th:href="@{/}" style="display: inline-block; margin-top: 1rem; padding: 0.75rem 2rem; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">
                Започни пазаруване
            </a>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer-simple}"></footer>
</body>
</html>

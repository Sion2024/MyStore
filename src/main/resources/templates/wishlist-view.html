<!DOCTYPE html>
<html lang="bg" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Списък Любими My Store</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/wishlist-view.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body class="wishlist-page">
    <div class="top-banner">
        Безплатна доставка за поръчки над 150 €
    </div>

    <header class="header">
        <div th:replace="~{fragments/header :: logo}"></div>
        <div class="search-bar">
            <form th:action="@{/products}" method="get" style="display: flex; width: 100%;">
                <input type="text" name="search" class="search-input" th:placeholder="#{header.search.placeholder}">
                <button type="submit" class="search-button">🔍</button>
            </form>
        </div>
        <div class="header-utils" style="margin-left: auto;">
            <a th:href="@{/change-language(lang=${#locale.language == 'bg' ? 'en' : 'bg'})}" class="language-selector" style="text-decoration: none; color: inherit;">
                <span th:if="${#locale.language == 'bg'}">🇬🇧</span>
                <span th:if="${#locale.language == 'en'}">🇧🇬</span>
                <span th:if="${#locale.language == 'bg'}" th:text="#{lang.english}">English</span>
                <span th:if="${#locale.language == 'en'}" th:text="#{lang.bulgarian}">Български</span>
            </a>
            <a class="icon-btn" th:href="@{/profile}" aria-label="Профил"
               th:classappend="${session.userId != null ? 'logged-in' : ''}"
               style="position: relative;">
                <span th:if="${session.userId != null}">✅</span>
                <span th:if="${session.userId == null}">👤</span>
            </a>
            <a class="icon-btn" th:href="@{/wishlist-view}" aria-label="Любими">❤️</a>
            <a class="icon-btn" th:href="@{/cart}" aria-label="Количка">🛒</a>
        </div>
    </header>

        <nav th:replace="~{fragments/nav :: nav}"></nav>

    <main class="wishlist-main">
        <div class="wishlist-container">
            <h1 class="wishlist-title">Списък Любими</h1>
            
            <div class="wishlist-products">
                <div class="wishlist-product-placeholder">
                    <div class="product-label">продукт</div>
                </div>
                <div class="wishlist-product-placeholder">
                    <div class="product-label">продукт</div>
                </div>
                <div class="wishlist-product-placeholder">
                    <div class="product-label">продукт</div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>

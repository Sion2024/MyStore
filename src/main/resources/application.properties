spring.application.name=Final Exam

#Data Source Properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/MyStore?allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Moni0306@

#JPA Properties
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect
#spring.jpa.properties.hibernate.format_sql = TRUE
spring.jpa.hibernate.ddl-auto = update
#spring.jpa.open-in-view=false

###Logging Levels
# Disable the default loggers
logging.level.org = WARN
logging.level.blog = WARN

#Show SQL executed with parameter bindings
logging.level.org.hibernate.SQL = off
logging.level.org.hibernate.type.descriptor = TRACE

#Change server port
server.port=8081

featureFlag.enabled = true

# Home page product limits
app.home.carousel-size=5
app.home.products-size=8

# Product image uploads
app.upload.dir=uploads/products
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Notification Service Configuration
notification.service.url=http://localhost:8082/api/v1/notifications

# Internationalization
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Timezone Configuration
spring.jackson.time-zone=Europe/Sofia

